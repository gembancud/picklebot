behaviors:
  PicklebotReturn:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 3
    even_checkpoints: true
    max_steps: 200000
    time_horizon: 128
    summary_freq: 5000

environment_parameters:
  phase1c_stage:
    curriculum:
      - name: contact-easy
        completion_criteria:
          measure: reward
          behavior: PicklebotReturn
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.15
        value: 0.0
      - name: return-easy
        completion_criteria:
          measure: reward
          behavior: PicklebotReturn
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.40
        value: 1.0
      - name: place-default
        completion_criteria:
          measure: reward
          behavior: PicklebotReturn
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.60
        value: 2.0
      - name: robust-hard
        value: 3.0
