behaviors:
  PicklebotArticulated:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 8192
      learning_rate: 3.0e-05
      learning_rate_schedule: constant
      beta: 0.005
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 8915374
    time_horizon: 128
    summary_freq: 2048
    checkpoint_interval: 32768
    keep_checkpoints: 512
    threaded: false
engine_settings:
  time_scale: 1
  no_graphics: true
torch_settings:
  device: cuda
