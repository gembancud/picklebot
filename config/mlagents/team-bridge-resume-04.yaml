behaviors:
  PicklebotArticulated:
    trainer_type: poca
    hyperparameters:
      batch_size: 128
      buffer_size: 512
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 4096
    time_horizon: 64
    summary_freq: 256
    checkpoint_interval: 512
    keep_checkpoints: 16
    threaded: false
    self_play:
      save_steps: 512
      team_change: 1024
      swap_steps: 256
      window: 2
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200
engine_settings:
  time_scale: 1
  no_graphics: true
torch_settings:
  device: cuda
