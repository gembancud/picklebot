behaviors:
  PicklebotArticulated:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 8192
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 4259880
    time_horizon: 128
    summary_freq: 2048
    checkpoint_interval: 65536
    keep_checkpoints: 96
    threaded: false
    self_play:
      save_steps: 32768
      team_change: 131072
      swap_steps: 16384
      window: 8
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200
engine_settings:
  time_scale: 1
  no_graphics: true
torch_settings:
  device: cuda
