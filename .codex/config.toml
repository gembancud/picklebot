# Project-local development bridge. Codex loads this file only when the
# repository is trusted. The Unity editor plugin starts the loopback server.
[mcp_servers.unityMCP]
url = "http://127.0.0.1:8080/mcp"
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "writes"
